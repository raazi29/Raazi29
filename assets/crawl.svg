<text class="in" x="450" y="186">A long time ago, in a repository far, far away…</text>
<g class="lg"><text x="450" y="190" font-size="54" stroke-width="2" letter-spacing="5">RAAZI</text><text x="450" y="212" font-size="11" stroke-width=".8" letter-spacing="7">THE CODE WARS</text></g>
<text class="l ep" style="animation-delay:7.6s">EPISODE XXIX</text><text class="l ti" style="animation-delay:8.9s">A NEW COMMIT</text><text class="l p" style="animation-delay:10.6s" textLength="650" lengthAdjust="spacing">It is a period of relentless shipping. Rebel</text><text class="l p" style="animation-delay:11.5s" textLength="650" lengthAdjust="spacing">builders, striking from a hidden terminal,</text><text class="l p" style="animation-delay:12.3s" textLength="650" lengthAdjust="spacing">have won their first victory against the evil</text><text class="l p" style="animation-delay:13.1s">Galactic Bug Tracker.</text><text class="l p" style="animation-delay:14.6s" textLength="650" lengthAdjust="spacing">During the battle, a lone developer pushed</text><text class="l p" style="animation-delay:15.5s" textLength="650" lengthAdjust="spacing">code faster than the CI could fail it, turning</text><text class="l p" style="animation-delay:16.3s" textLength="650" lengthAdjust="spacing">caffeine into commits with the power of</text><text class="l p" style="animation-delay:17.1s">the Force.</text><text class="l p" style="animation-delay:18.6s" textLength="650" lengthAdjust="spacing">Pursued by merge conflicts and sinister flaky</text><text class="l p" style="animation-delay:19.4s" textLength="650" lengthAdjust="spacing">tests, RAAZI races home aboard a battered</text><text class="l p" style="animation-delay:20.3s" textLength="650" lengthAdjust="spacing">laptop, custodian of the green squares that</text><text class="l p" style="animation-delay:21.1s">can restore the streak to the galaxy…</text>
<g class="st" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#ffd84a" text-anchor="middle"><text x="450" y="150" font-size="22" letter-spacing="6">EPISODE XXIX</text><text x="450" y="200" font-size="44" letter-spacing="4">A NEW COMMIT</text><text x="450" y="244" font-size="18" font-weight="400" fill="#c9d3e3">May the source be with you.</text></g>
</svg>

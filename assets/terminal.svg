<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="raazi@grid ~ $ whoami — raazi. builds AI tools and the software that runs them.">
  <style>
    .bg { fill: #07090d; }
    .rim { fill: none; stroke: #1a212b; }
    .bar { fill: #0c0f15; }
    .dot { fill: #29323f; }
    .t { font-family: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #d5dbe6; white-space: pre; }
    .p { fill: #4cc2ff; }
    .m { fill: #6c7689; }
    .h { fill: #e7ecf4; font-weight: 700; }
    .title { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #6c7689; letter-spacing: .08em; }
    /* each line is revealed by a clip that grows like typing */
    .reveal { animation: type var(--d, 0.9s) steps(var(--n, 20), end) var(--s, 0s) both; }
    @keyframes type { from { width: 0; } to { width: 880px; } }
    .cursor { fill: #4cc2ff; animation: blink 1.05s steps(1, end) 5s infinite; }
    @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .reveal { animation: none; width: 880px; } .cursor { animation: none; } }
  </style>
  <defs>
    <clipPath id="c1"><rect class="reveal" style="--s:.3s;--n:18;--d:.9s" x="0" y="52" height="26" /></clipPath>
    <clipPath id="c2"><rect class="reveal" style="--s:1.4s;--n:1;--d:.01s" x="0" y="76" height="26" /></clipPath>
    <clipPath id="c3"><rect class="reveal" style="--s:2.0s;--n:20;--d:.9s" x="0" y="104" height="26" /></clipPath>
    <clipPath id="c4"><rect class="reveal" style="--s:3.1s;--n:1;--d:.01s" x="0" y="128" height="26" /></clipPath>
    <clipPath id="c5"><rect class="reveal" style="--s:3.8s;--n:10;--d:.6s" x="0" y="156" height="26" /></clipPath>
    <clipPath id="c6"><rect class="reveal" style="--s:4.6s;--n:1;--d:.01s" x="0" y="180" height="26" /></clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="879" height="219" rx="10" />
  <rect class="bar" x="1" y="1" width="878" height="30" rx="9.5" />
  <rect class="bar" x="1" y="20" width="878" height="11" />
  <rect class="rim" x="0.5" y="0.5" width="879" height="219" rx="10" />
  <circle class="dot" cx="20" cy="16" r="5" /><circle class="dot" cx="38" cy="16" r="5" /><circle class="dot" cx="56" cy="16" r="5" />
  <text class="title" x="440" y="20" text-anchor="middle">raazi@grid</text>

  <g clip-path="url(#c1)"><text class="t" x="24" y="70"><tspan class="p">raazi@grid</tspan><tspan class="m"> ~ $ </tspan>whoami</text></g>
  <g clip-path="url(#c2)"><text class="t h" x="24" y="94">raazi</text></g>
  <g clip-path="url(#c3)"><text class="t" x="24" y="122"><tspan class="p">raazi@grid</tspan><tspan class="m"> ~ $ </tspan>cat focus</text></g>
  <g clip-path="url(#c4)"><text class="t" x="24" y="146">AI agents · developer tools · software that serves the public</text></g>
  <g clip-path="url(#c5)"><text class="t" x="24" y="174"><tspan class="p">raazi@grid</tspan><tspan class="m"> ~ $ </tspan>./now</text></g>
  <g clip-path="url(#c6)"><text class="t" x="24" y="198">building a grid that runs many coding agents at once<tspan class="cursor"> █</tspan></text></g>
</svg>

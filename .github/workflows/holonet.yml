name: Holonet

# Daily telemetry for the profile README, published to the `output` branch. Disabled while
# Actions are unavailable on this account; scripts/refresh.ps1 does the same job locally.
on:
  schedule:
    - cron: "17 0 * * *" # every day, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: holonet
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Targeting computer and contribution map
        run: node scripts/holonet.mjs
        env:
          # Optional PROFILE_TOKEN (a PAT with read:user) also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

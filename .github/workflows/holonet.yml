name: Holonet

# Daily telemetry for the profile README: the targeting-computer commit chart and the
# contribution-grid probe droid, published to the `output` branch.
on:
  schedule:
    - cron: "17 0 * * *" # every day, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: holonet
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Targeting computer
        run: node scripts/holonet.mjs
        env:
          # Optional PROFILE_TOKEN (a PAT with read:user) also counts private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Probe droid
        uses: Platane/snk@v3
        with:
          github_user_name: raazi29
          outputs: |
            dist/snake.svg?color_snake=#ff4b3e&color_dots=#ebedf0,#ffe9a8,#ffd84a,#f0a500,#c47a00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4b3e&color_dots=#161b22,#4a3a12,#7a5c12,#c48a14,#ffd84a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
